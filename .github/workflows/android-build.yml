name: Android CI/CD - Build Slim APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual 1-click build trigger from GitHub Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode google-services.json from GitHub Secrets
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "Error: GOOGLE_SERVICES_JSON_BASE64 secret is missing!"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_B64" | base64 --decode > app/google-services.json

      - name: Decode Release Keystore (If Provided)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > app/release-keystore.jks
            echo "Release keystore decoded successfully."
          else
            echo "No release keystore found in secrets. Proceeding without release signing file."
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        env:
          FREEIMAGE_API_KEY: ${{ secrets.FREEIMAGE_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || (echo "Retrying assembleDebug after transient error..." && sleep 5 && ./gradlew assembleDebug --no-daemon --stacktrace)
          if [ -f "app/release-keystore.jks" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace || (echo "Retrying assembleRelease after transient error..." && sleep 5 && ./gradlew assembleRelease --no-daemon --stacktrace)
          fi

      - name: Organize & Rename Split APKs
        run: |
          mkdir -p build-apks
          # Find and copy each specific ABI apk
          cp $(find app/build/outputs/apk/debug -name "*universal*.apk" | head -n 1) build-apks/QawmiAlumni-Universal-AllDevices.apk || true
          cp $(find app/build/outputs/apk/debug -name "*arm64-v8a*.apk" | head -n 1) build-apks/QawmiAlumni-ARM64-ModernPhones.apk || true
          cp $(find app/build/outputs/apk/debug -name "*armeabi-v7a*.apk" | head -n 1) build-apks/QawmiAlumni-ARMv7-OlderPhones.apk || true
          cp $(find app/build/outputs/apk/debug -name "*x86_64*.apk" | head -n 1) build-apks/QawmiAlumni-x86_64-Emulators.apk || true

          echo "### 📦 Generated APK Files (পৃথক ৪টি এপিকে)" >> $GITHUB_STEP_SUMMARY
          echo "| এপিকে নাম | ফাইল | উপযুক্ত ডিভাইস |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Universal (সর্বজনীন)** | \`QawmiAlumni-Universal-AllDevices.apk\` | যেকোনো অ্যান্ড্রয়েড ফোন (সব ডিভাইসে চলবে) |" >> $GITHUB_STEP_SUMMARY
          echo "| **ARM64 (আধুনিক)** | \`QawmiAlumni-ARM64-ModernPhones.apk\` | আধুনিক ৬৪-বিট স্মার্টফোন (স্যামসাং, শাওমি ইত্যাদি) |" >> $GITHUB_STEP_SUMMARY
          echo "| **ARMv7 (পুরাতন)** | \`QawmiAlumni-ARMv7-OlderPhones.apk\` | পুরাতন / লো-এন্ড ৩২-বিট স্মার্টফোন |" >> $GITHUB_STEP_SUMMARY
          echo "| **x86_64 (এমুলেটর)** | \`QawmiAlumni-x86_64-Emulators.apk\` | পিসি / ল্যাপটপ এমুলেটর (BlueStacks ইত্যাদি) |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Universal APK (সব ডিভাইসের জন্য)
        uses: actions/upload-artifact@v4
        with:
          name: 1-QawmiAlumni-Universal-AllDevices
          path: build-apks/QawmiAlumni-Universal-AllDevices.apk
          if-no-files-found: warn

      - name: Upload ARM64 APK (আধুনিক স্মার্টফোনের জন্য)
        uses: actions/upload-artifact@v4
        with:
          name: 2-QawmiAlumni-ARM64-ModernPhones
          path: build-apks/QawmiAlumni-ARM64-ModernPhones.apk
          if-no-files-found: warn

      - name: Upload ARMv7 APK (পুরাতন স্মার্টফোনের জন্য)
        uses: actions/upload-artifact@v4
        with:
          name: 3-QawmiAlumni-ARMv7-OlderPhones
          path: build-apks/QawmiAlumni-ARMv7-OlderPhones.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK (পিসি এমুলেটরের জন্য)
        uses: actions/upload-artifact@v4
        with:
          name: 4-QawmiAlumni-x86_64-Emulators
          path: build-apks/QawmiAlumni-x86_64-Emulators.apk
          if-no-files-found: warn

      - name: Upload Signed Release APK Artifact (If Available)
        if: hashFiles('app/release-keystore.jks') != ''
        uses: actions/upload-artifact@v4
        with:
          name: QawmiAlumni-Release-Signed-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Deploy Preview to Appetize.io
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ -z "$APPETIZE_TOKEN" ]; then
            echo "APPETIZE_API_TOKEN secret is not configured. Skipping Appetize deployment."
            exit 0
          fi

          APK_PATH=$(find app/build/outputs/apk/debug -name "*universal*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          echo "Found APK to upload: $APK_PATH"

          APPETIZE_KEY="${APPETIZE_PUBLIC_KEY:-uxs2ceysanfzba5vgujfatbs2m}"
          echo "Updating Appetize app: $APPETIZE_KEY"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.appetize.io/v1/apps/$APPETIZE_KEY" \
            -u "$APPETIZE_TOKEN:" \
            -F "file=@$APK_PATH" \
            -F "platform=android")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')
          echo "Appetize update response ($HTTP_STATUS): $BODY"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Appetize update returned $HTTP_STATUS; creating new Appetize app via /v1/apps..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.appetize.io/v1/apps" \
              -u "$APPETIZE_TOKEN:" \
              -F "file=@$APK_PATH" \
              -F "platform=android")
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')
            echo "Appetize create response ($HTTP_STATUS): $BODY"
          fi

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            PUBLIC_URL=$(echo "$BODY" | grep -o '"publicURL":"[^"]*' | cut -d'"' -f4)
            APP_URL=${PUBLIC_URL:-"https://appetize.io/app/$APPETIZE_KEY"}
            echo "✅ Appetize Live Browser Preview: $APP_URL"
            echo "### 📱 Appetize.io Live App Preview" >> $GITHUB_STEP_SUMMARY
            echo "Your Android App is ready to test directly in the browser:" >> $GITHUB_STEP_SUMMARY
            echo "[▶️ Open Appetize.io Live Preview]($APP_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Appetize upload failed with HTTP status $HTTP_STATUS: $BODY"
          fi


